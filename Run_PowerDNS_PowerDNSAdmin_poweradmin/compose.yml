#      - MYSQL_USER=poweradmin
#      - MYSQL_PASSWORD=password
#    volumes:
#      - mysql_data:/var/lib/mysql

networks:
  pdns-pgsql:
    ipam:
      config:
        - subnet: 172.8.0.0/16
          gateway: 172.8.0.1

volumes:
  pgsql:
  poweradmin-config:
  poweradmin-db:
  mysql_data: